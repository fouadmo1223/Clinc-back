name: Keep backend and database warm

# Render's free tier spins the web service down after ~15 minutes of no traffic, and the
# next request then pays a slow cold-start. This hits our health endpoint on a schedule so
# there's periodic real traffic — it also does a real MongoDB ping (see
# src/health/health.controller.ts), not just an HTTP 200 from a process that's up.
on:
  schedule:
    - cron: '0 6 */3 * *' # 06:00 UTC, every 3rd day of the month
  workflow_dispatch: {} # allows a manual "Run workflow" click for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          url="${{ vars.RENDER_HEALTH_URL || 'https://clinc-back-lbdq.onrender.com/api/health' }}"
          echo "Pinging $url"
          curl --fail --silent --show-error --retry 3 --retry-delay 15 --max-time 60 "$url"
